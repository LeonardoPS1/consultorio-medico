name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in sync with dashboard/Dockerfile (corepack prepare pnpm@11.20.0).
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # The workspace resolves against the root lockfile, not dashboard/pnpm-lock.yaml.
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Next.js build
        run: pnpm build
        env:
          # The build must not depend on production secrets. These placeholders
          # are only read at build time and never reach a deployed container.
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: dashboard
          storybookBuildDir: storybook-static
          # Visual diffs must be reviewed: never auto-accept unexpected changes.
          exitZeroOnChanges: false
          autoAcceptChanges: false
