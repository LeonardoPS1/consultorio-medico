name: Build & Deploy Ops Console

on:
  push:
    branches: [main]
    paths:
      - 'ops-console/**'
      - '.github/workflows/deploy-ops.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-build check (ops-console)
        run: pnpm --filter aicore-ops run build

      - name: Build and push ops-console image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops-console/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LC }}-ops:latest
            ghcr.io/${{ env.REPOSITORY_LC }}-ops:${{ github.sha }}
          platforms: linux/amd64

      - name: Trigger Dokploy deploy (ops-console) via direct API
        run: |
          curl -s -k -X POST 'https://dokploy.aicorebots.com/api/application.deploy' \
            -H 'accept: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{"applicationId":"${{ secrets.DOKPLOY_OPS_APP_ID }}","cleanCache":true}'

      - name: Wait for rolling update
        run: sleep 120

      - name: Notify deploy status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -A 'Mozilla/5.0' -X POST 'https://n8n.aicorebots.com/webhook/notify-deploy-status' \
            -H 'Content-Type: application/json' \
            -d "{\"status\":\"$STATUS\",\"workflow\":\"Build & Deploy Ops Console\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\"}" || true
