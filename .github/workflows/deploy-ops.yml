name: Build & Deploy Ops Console

on:
  push:
    branches: [main]
    paths:
      - 'ops-console/**'
      - '.github/workflows/deploy-ops.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build check
        run: |
          cd ops-console
          npm install --silent
          npm run build

      - name: Build and push ops-console image
        uses: docker/build-push-action@v5
        with:
          context: ./ops-console
          file: ./ops-console/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LC }}-ops:latest
            ghcr.io/${{ env.REPOSITORY_LC }}-ops:${{ github.sha }}
          platforms: linux/amd64

      - name: Trigger Dokploy deploy (ops-console) via Dashboard proxy
        run: |
          curl -s -k -X POST 'https://med.aicorebots.com/api/deploy/dokploy' \
            -H 'accept: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{"applicationId":"${{ secrets.DOKPLOY_OPS_APP_ID }}"}'

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' 'https://ops.aicorebots.com/api/health' 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (200)"
              exit 0
            fi
            echo "Attempt $i: health check returned $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts"
          exit 1

      - name: Smoke test
        run: |
          RESPONSE=$(curl -s 'https://ops.aicorebots.com/api/health')
          echo "$RESPONSE" | grep -q '"db":{"connected":true}' && echo "Smoke test passed" || (echo "Smoke test failed: $RESPONSE" && exit 1)
