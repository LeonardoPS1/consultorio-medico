name: Build & Deploy Ops Console

on:
  push:
    branches: [main]
    paths:
      - 'ops-console/**'
      - '.github/workflows/deploy-ops.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-build check (ops-console)
        run: pnpm --filter aicore-ops run build

      - name: Build and push ops-console image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops-console/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LC }}-ops:latest
            ghcr.io/${{ env.REPOSITORY_LC }}-ops:${{ github.sha }}
          platforms: linux/amd64

      - name: Trigger Dokploy deploy (ops-console)
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_OPS_APP_ID: ${{ secrets.DOKPLOY_OPS_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_API_KEY:-}" ] || [ -z "${DOKPLOY_OPS_APP_ID:-}" ]; then
            echo "::error::Faltan los secretos DOKPLOY_API_KEY o DOKPLOY_OPS_APP_ID"
            exit 1
          fi

          body=$(printf '{"applicationId":"%s","cleanCache":true}' "$DOKPLOY_OPS_APP_ID")
          status=$(curl -sS --fail-with-body -o /tmp/deploy.json -w '%{http_code}' \
            -X POST 'https://dokploy.aicorebots.com/api/application.deploy' \
            -H 'accept: application/json' \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$body") || {
              echo "::error::Dokploy respondió ${status}: $(cat /tmp/deploy.json 2>/dev/null | head -c 500)"
              exit 1
            }

          echo "Dokploy respondió ${status}: $(head -c 500 /tmp/deploy.json)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy rechazó el deploy (HTTP ${status})"
            exit 1
          fi

      - name: Wait for the ops console to answer healthy
        env:
          HEALTH_URL: ${{ vars.OPS_HEALTH_URL || 'https://ops.aicorebots.com/api/health' }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 600))
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$HEALTH_URL" || true)
            echo "health HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Ops console responde 200."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timeout esperando ${HEALTH_URL}. Revisar el servicio en Dokploy."
          exit 1

      - name: Notify deploy status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -A 'Mozilla/5.0' -X POST 'https://n8n.aicorebots.com/webhook/notify-deploy-status' \
            -H 'Content-Type: application/json' \
            -d "{\"status\":\"$STATUS\",\"workflow\":\"Build & Deploy Ops Console\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\"}" || true
