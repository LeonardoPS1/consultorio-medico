name: Build & Deploy to ghcr.io

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs-site/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - Environment Info
        shell: bash
        run: |
          echo "=== Environment ==="
          env | grep -E '^(GITHUB|DOCKER|RUNNER)' || true
          echo "=== Docker Info ==="
          docker version
          echo "=== Build Context ==="
          ls -laR

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LC }}:latest
            ghcr.io/${{ env.REPOSITORY_LC }}:${{ github.sha }}
          platforms: linux/amd64

      - name: Trigger Dokploy deploy (dashboard) via direct API
        run: |
          curl -s -k -X POST 'https://dokploy.aicorebots.com/api/application.deploy' \
            -H 'accept: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{"applicationId":"${{ secrets.DOKPLOY_APP_ID }}","cleanCache":true}'

      - name: Wait for rolling update
        run: sleep 300

      - name: Health check
        run: |
          for i in $(seq 1 36); do
            # Try via VPS IP with Host header to bypass Cloudflare, follow redirects
            STATUS=$(curl -sL -o /dev/null -w '%{http_code}' -H "Host: med.aicorebots.com" 'http://51.222.207.250/api/health' 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "Health check passed ($STATUS)"
              exit 0
            fi
            echo "Attempt $i: health check returned $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 36 attempts"
          exit 1

      - name: Smoke test
        run: |
          RESPONSE=$(curl -sL -H "Host: med.aicorebots.com" 'http://51.222.207.250/api/health')
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"healthy"\|"status":"degraded"\|"ok":true\|"healthy":true' && echo "Smoke test passed" || (echo "Smoke test failed" && exit 1)

      - name: Notify deploy status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST 'https://n8n.aicorebots.com/webhook/notify-deploy-status' \
            -H 'Content-Type: application/json' \
            -d "{\"status\":\"$STATUS\",\"workflow\":\"Build & Deploy Dashboard\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\"}" || true
