name: Build & Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'

jobs:
  docs-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push docs image
        uses: docker/build-push-action@v5
        with:
          context: ./docs-site/aicoremed-docs
          file: ./docs-site/aicoremed-docs/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LC }}-docs:latest
            ghcr.io/${{ env.REPOSITORY_LC }}-docs:${{ github.sha }}

      - name: Trigger Dokploy deploy (docs) via Dashboard proxy
        env:
          DEPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOCS_APP_ID: ${{ secrets.DOKPLOY_DOCS_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_API_KEY:-}" ] || [ -z "${DOCS_APP_ID:-}" ]; then
            echo "::error::Faltan los secretos DOKPLOY_API_KEY o DOKPLOY_DOCS_APP_ID"
            exit 1
          fi

          body=$(printf '{"applicationId":"%s"}' "$DOCS_APP_ID")
          status=$(curl -sS --fail-with-body -o /tmp/deploy.json -w '%{http_code}' \
            -X POST 'https://med.aicorebots.com/api/deploy/dokploy' \
            -H 'accept: application/json' \
            -H "x-api-key: ${DEPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$body") || {
              echo "::error::La API de deploy respondió ${status}: $(cat /tmp/deploy.json 2>/dev/null | head -c 500)"
              exit 1
            }

          echo "Deploy respondió ${status}: $(head -c 500 /tmp/deploy.json)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::La API de deploy rechazó la operación (HTTP ${status})"
            exit 1
          fi
